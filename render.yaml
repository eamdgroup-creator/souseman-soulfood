# Render Blueprint: New → Blueprint → pick this repo.
# Free static site (served from Render's CDN, no cold starts).
services:
  - type: web
    name: souseman-soulfood
    runtime: static
    buildCommand: npm install --include=dev --no-audit --no-fund && npm run build
    staticPublishPath: ./out
    envVars:
      - key: NEXT_PUBLIC_SITE_URL
        value: https://souseman-soulfood.onrender.com
      - key: NEXT_PUBLIC_PREVIEW
        value: "1"
      - key: NODE_VERSION
        value: "22"
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /opengraph-image
        name: Content-Type
        value: image/png
      - path: /_next/static/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /images/*
        name: Cache-Control
        value: public, max-age=604800
